[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "aios"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "starlette==1.6.0", "uvicorn==0.35.0", "httpx==0.28.1", "argon2-cffi==25.1.0", "psutil==7.0.0", "PyYAML==6.0.2", "prometheus-client==0.22.1", "cryptography==50.0.1", "python-multipart==0.0.32"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "ruff==0.12.9", "mypy==1.17.1", "types-PyYAML==6.0.12.20250809", "types-psutil==7.0.0.20250801"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.setuptools.package-data]
aios = ["schema.sql"]
