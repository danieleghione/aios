limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/aios.crt;
    ssl_certificate_key /etc/nginx/aios.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    location = /admin { return 308 /admin/; }
    location /admin/ {
        alias /opt/aios/app/frontend-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }
    location /api/v1/aios/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /api/v1/aios/backups/upload {
        client_max_body_size 20g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8081;
    }
    location /api/v1/aios/ { proxy_pass http://127.0.0.1:8081; }
    location = /api/aios/docs { proxy_pass http://127.0.0.1:8081; }
    location = /api/aios/openapi.json { proxy_pass http://127.0.0.1:8081; }
    location /v1/ { proxy_buffering off; proxy_pass http://127.0.0.1:8081; }
    location = /health { proxy_pass http://127.0.0.1:8081; }
    location = /metrics { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://127.0.0.1:8081; }
    location = /_aios/chat-session {
        internal;
        proxy_pass http://127.0.0.1:8081/_aios/chat-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location @chat_login { return 302 /admin/?next=chat; }
    # auth_request only translates 401 and 403; every other status from the
    # identity check surfaces as a bare 500. Open WebUI takes minutes to start on
    # a fresh install, so say that plainly instead of showing a server error.
    location @chat_starting {
        default_type text/html;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="15"><title>AIOS - chat starting</title><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 0,rgba(59,109,255,.18),transparent 60%),#05070e;color:#d3ddf0;font-family:system-ui,sans-serif"><main style="max-width:34rem;padding:2rem;text-align:center"><img src="/admin/aios-mark.png" alt="AIOS" style="width:120px"><h1 style="font-weight:650;letter-spacing:-.6px;color:#e9effb">The chat is starting</h1><p style="line-height:1.6;color:#8b9cba">Open WebUI finishes its migrations and module loading on first start: this can take a few minutes. This page refreshes on its own.</p><p style="color:#8b9cba">The administration portal is already available at <a style="color:#22d3ee" href="/admin/">/admin/</a>.</p></main></body>';    }
    location / {
        auth_request /_aios/chat-session;
        auth_request_set $chat_email $upstream_http_x_aios_email;
        auth_request_set $chat_name $upstream_http_x_aios_name;
        auth_request_set $chat_role $upstream_http_x_aios_role;
        error_page 401 403 = @chat_login;
        error_page 500 502 503 504 = @chat_starting;
        proxy_set_header X-AIOS-Email $chat_email;
        proxy_set_header X-AIOS-Name $chat_name;
        proxy_set_header X-AIOS-Role $chat_role;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }
}
